# ZJU-Omni (lite) for DeepSeek Harness. Generated by `npm run package -- dsh`;
# paste these entries into ~/.dsh/profiles/<profile>/cordis.patch.yml.
# Paths below are absolute and specific to this machine.
- insert:
    - id: zju-omni
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: zju
        transport: stdio
        command: __NODE__
        args: ['__ROOT__/dist/server.js']
        cwd: '__ROOT__'
        env:
          MCP_TOOL_PROFILE: lite
        toolCallTimeoutMs: 120000
    - id: zju-omni-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: zju-omni
        includeDefaultRoots: false
        watch: false
        customSkillDirs: ['__SKILLS__']
