# ZJU-Omni "浙大助手" overlay for DeepSeek Harness: a lean agent for small local
# models. Apply on top of zju-omni.cordis.patch.yml, e.g.
#   dsh --profile headless --patch zju-omni.cordis.patch.yml --patch zju-assistant.patch.yml "明天有什么课"
# It removes shell/file/web/sub-agent/planning tools and replaces the coding persona,
# so the model only sees the ZJU tools and a short Chinese instruction.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    personaPrefix: >-
      你是浙江大学学生的校园助手，用中文简洁回答。只用 mcp__zju__ 开头的工具查询课程、作业、成绩、考试、课表、课堂回放、拼题A和CC98；
      不要编造工具没有返回的信息，不要自己推算日期、学分或时间，直接使用工具返回的值；工具提示结果没变时立即回答。
      交作业、发帖等写操作必须先预览并得到用户明确确认。
    personaSuffix: ''
- id: agent-instructions
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-web
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: plan-mode
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: mcp-resources
  disabled: true
- id: skill-filesystem
  disabled: true
- id: zju-omni-skills
  disabled: true
- id: tool-skill
  disabled: true
